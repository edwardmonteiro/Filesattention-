<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Layer 1: History (lightest, widest) -->
  <rect x="8" y="8" width="48" height="7" rx="3" ry="3" fill="#94A3B8"/>
  <!-- Layer 2: Memory (medium) -->
  <rect x="13" y="18" width="38" height="7" rx="3" ry="3" fill="#64748B"/>
  <!-- Layer 3: Scratchpad (darkest, narrowest) -->
  <rect x="18" y="28" width="28" height="7" rx="3" ry="3" fill="#475569"/>
  <!-- Converging lines from layers to diamond -->
  <line x1="22" y1="35" x2="29" y2="42" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="42" y1="35" x2="35" y2="42" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Attention diamond -->
  <rect x="24.5" y="38.5" width="15" height="15" rx="2.5" ry="2.5" fill="#3B82F6" transform="rotate(45 32 46)"/>
  <!-- Output line -->
  <line x1="32" y1="57" x2="32" y2="62" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
</svg>
